; platformio.ini - builds verse.cpp for the Waveshare ESP32-S3-ePaper-1.54 V2 (ESP32-S3-PICO-1 N8R8). Run ./build.sh, not pio directly (482).
[platformio]
src_dir = .
include_dir = .
test_dir = test-none

[env:epaper-verse]
platform = espressif32 @ 8.0.0
platform_packages = platformio/framework-arduinoespressif32 @ 4.30312.261024
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 8MB
board_build.partitions = huge_app.csv
build_src_filter = -<*> +<verse.cpp>
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  zinggjm/GxEPD2 @ 1.6.9
  adafruit/Adafruit GFX Library @ 1.13.0
  adafruit/Adafruit BusIO @ 1.17.4
