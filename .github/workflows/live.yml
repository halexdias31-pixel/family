# THE LIVE SITE, SIGNED OUT (docs/history/780). Nightly, by hand, and 30 minutes after a push to main: every public
# column at 390 and 1440 px with no console error, page error or failed same-origin request, and the live
# --css-version equal to main's style.css (else the deploy did not land). Read-only: no secrets, no sign-in, no writes.
name: Live site

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'style.css', 'js/**', 'data/**']

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - name: Wait until 30 minutes after the push
        if: github.event_name == 'push'
        run: sleep 1800
      - name: Smoke test https://atfamily.co.uk/
        run: |
          export EXPECT_CSS="$(grep -m1 -oE -- '--css-version: *"[^"]+"' style.css | sed -E 's/.*"([^"]+)"/\1/')"
          echo "main's --css-version: $EXPECT_CSS"
          set -o pipefail
          node check/live-smoke.js --shots=live-shots | tee live.log
          tail -40 live.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-screenshots
          path: |
            live-shots/
            live.log
          if-no-files-found: ignore
          retention-days: 14
