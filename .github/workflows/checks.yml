# THE CHECK SUITE ON GITHUB'S FREE RUNNERS (docs/history/780). Every push and every PR to main: a ✅/❌ per commit.
# The library's private words (data-private/) are not here and are never fetched: LIB_PRIVATE=absent makes every check
# that needs them skip, counted, and each job's summary lists what was skipped. The full set still runs locally.
name: Checks

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  LIB_PRIVATE: absent
  FORCE_COLOR: '0'

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'fast', cmd: 'node js/check.js && node js/check-all.js --fast', browser: true }
          - { name: 'flow 1/8', cmd: 'FLOW_PART=1/8 node --max-old-space-size=3000 js/check-flow.js' }
          - { name: 'flow 2/8', cmd: 'FLOW_PART=2/8 node --max-old-space-size=3000 js/check-flow.js' }
          - { name: 'flow 3/8', cmd: 'FLOW_PART=3/8 node --max-old-space-size=3000 js/check-flow.js' }
          - { name: 'flow 4/8', cmd: 'FLOW_PART=4/8 node --max-old-space-size=3000 js/check-flow.js' }
          - { name: 'flow 5/8', cmd: 'FLOW_PART=5/8 node --max-old-space-size=3000 js/check-flow.js' }
          - { name: 'flow 6/8', cmd: 'FLOW_PART=6/8 node --max-old-space-size=3000 js/check-flow.js' }
          - { name: 'flow 7/8', cmd: 'FLOW_PART=7/8 node --max-old-space-size=3000 js/check-flow.js' }
          - { name: 'flow 8/8', cmd: 'FLOW_PART=8/8 node --max-old-space-size=3000 js/check-flow.js' }
          - { name: 'browser 1/8', cmd: 'node js/check-all.js --slow=1/8 -v', browser: true }
          - { name: 'browser 2/8', cmd: 'node js/check-all.js --slow=2/8 -v', browser: true }
          - { name: 'browser 3/8', cmd: 'node js/check-all.js --slow=3/8 -v', browser: true }
          - { name: 'browser 4/8', cmd: 'node js/check-all.js --slow=4/8 -v', browser: true }
          - { name: 'browser 5/8', cmd: 'node js/check-all.js --slow=5/8 -v', browser: true }
          - { name: 'browser 6/8', cmd: 'node js/check-all.js --slow=6/8 -v', browser: true }
          - { name: 'browser 7/8', cmd: 'node js/check-all.js --slow=7/8 -v', browser: true }
          - { name: 'browser 8/8', cmd: 'node js/check-all.js --slow=8/8 -v', browser: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Playwright version (the one package-lock.json pins)
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        if: matrix.browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: matrix.browser
        run: npx playwright install --with-deps chromium
      - name: Run
        env:
          LIB_SKIP_LOG: ${{ runner.temp }}/lib-skipped.txt
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          bash -c "${{ matrix.cmd }}" 2>&1 | tee "$RUNNER_TEMP/logs/run.log"
      - name: Summary — what was not checked
        if: always()
        env:
          LIB_SKIP_LOG: ${{ runner.temp }}/lib-skipped.txt
        run: |
          {
            echo "### ${{ matrix.name }}"
            grep -E '^(OK|FAILED) —' "$RUNNER_TEMP/logs/run.log" | tail -3 || true
            if [ -s "$LIB_SKIP_LOG" ]; then
              echo ""
              echo "**Skipped $(wc -l < "$LIB_SKIP_LOG") library check(s): no private words (LIB_PRIVATE=absent).** These are NOT green, only not run here:"
              echo ""
              sed 's/^/- /; s/\t/ — /' "$LIB_SKIP_LOG"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/logs/
            ${{ runner.temp }}/lib-skipped.txt
            /tmp/**/*.png
            check/**/*.png
          if-no-files-found: ignore
          retention-days: 14

  stability:
    name: stability guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Score, head against base
        run: |
          set -o pipefail
          node check/stability-guard.js .base | tee -a "$GITHUB_STEP_SUMMARY"
