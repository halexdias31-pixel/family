# THE CHECK SUITE ON GITHUB'S FREE RUNNERS (docs/history/780). Every push and every PR to main: a ✅/❌ per commit.
# The `check` jobs are CORE only and blocking (860, data/settings/tiers.json); the `secondary` jobs below never block.
# The library's private words (data-private/) are not here and are never fetched: LIB_PRIVATE=absent makes every check
# that needs them skip, counted, and each job's summary lists what was skipped. The full set still runs locally.
name: Checks

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  LIB_PRIVATE: absent
  FORCE_COLOR: '0'

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # REQUIRED = fast + core journeys only (owner, 7 Nov, 1090): Find, library, questions, settings, bookings; ~10 min.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'fast', cmd: 'node js/check.js && node js/check-all.js --fast', browser: true }
          - { name: 'flow 1/8', cmd: 'FLOW_PART=1/8 node --max-old-space-size=3000 js/check-flow.js' }
          - { name: 'flow 2/8', cmd: 'FLOW_PART=2/8 node --max-old-space-size=3000 js/check-flow.js' }
          - { name: 'flow 3/8', cmd: 'FLOW_PART=3/8 node --max-old-space-size=3000 js/check-flow.js' }
          - { name: 'flow 4/8', cmd: 'FLOW_PART=4/8 node --max-old-space-size=3000 js/check-flow.js' }
          - { name: 'flow 5/8', cmd: 'FLOW_PART=5/8 node --max-old-space-size=3000 js/check-flow.js' }
          - { name: 'flow 6/8', cmd: 'FLOW_PART=6/8 node --max-old-space-size=3000 js/check-flow.js' }
          - { name: 'flow 7/8', cmd: 'FLOW_PART=7/8 node --max-old-space-size=3000 js/check-flow.js' }
          - { name: 'flow 8/8', cmd: 'FLOW_PART=8/8 node --max-old-space-size=3000 js/check-flow.js' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Playwright version (the one package-lock.json pins)
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        if: matrix.browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: matrix.browser
        run: npx playwright install --with-deps chromium
      - name: Run
        env:
          LIB_SKIP_LOG: ${{ runner.temp }}/lib-skipped.txt
          # A free runner is slower than the machine check-all's 15 minutes were set on: a browser check gets 30 here (840).
          CHECK_LIMIT_S: '1800'
          # Anything a check writes to the temp dir lands where the artifact step may read it (/tmp has unreadable dirs).
          TMPDIR: ${{ runner.temp }}/tmp
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs" "$RUNNER_TEMP/tmp"
          bash -c "${{ matrix.cmd }}" 2>&1 | tee "$RUNNER_TEMP/logs/run.log"
      - name: Summary — what was not checked
        if: always()
        env:
          LIB_SKIP_LOG: ${{ runner.temp }}/lib-skipped.txt
        run: |
          {
            echo "### ${{ matrix.name }}"
            grep -E '^(OK|FAILED) —' "$RUNNER_TEMP/logs/run.log" | tail -3 || true
            if [ -s "$LIB_SKIP_LOG" ]; then
              echo ""
              echo "**Skipped $(wc -l < "$LIB_SKIP_LOG") library check(s): no private words (LIB_PRIVATE=absent).** These are NOT green, only not run here:"
              echo ""
              sed 's/^/- /; s/\t/ — /' "$LIB_SKIP_LOG"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/logs/
            ${{ runner.temp }}/lib-skipped.txt
            ${{ runner.temp }}/tmp/**/*.png
            check/**/*.png
          if-no-files-found: ignore
          retention-days: 14

  # SECONDARY, REPORT-ONLY (docs/history/860): everything data/settings/tiers.json does not call core. It runs and says WARN
  # with counts, and never fails the commit: continue-on-error, and the checks themselves exit 0 on a secondary finding.
  secondary:
    name: 'secondary (report-only): ${{ matrix.name }}'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'checks', cmd: 'node js/check-all.js --tier=secondary -v' }
          - { name: 'journeys 1/2', cmd: 'FLOW_TIER=secondary FLOW_PART=1/2 node --max-old-space-size=3000 js/check-flow.js' }
          - { name: 'journeys 2/2', cmd: 'FLOW_TIER=secondary FLOW_PART=2/2 node --max-old-space-size=3000 js/check-flow.js' }
          # The slow browser and heavy groups (840): report-only since the core freeze (1090), so they never hold up a commit.
          - { name: 'browser 1/8', cmd: 'CHECK_LIMIT_S=1800 node js/check-all.js --slow=1/8 -v' }
          - { name: 'browser 2/8', cmd: 'CHECK_LIMIT_S=1800 node js/check-all.js --slow=2/8 -v' }
          - { name: 'browser 3/8', cmd: 'CHECK_LIMIT_S=1800 node js/check-all.js --slow=3/8 -v' }
          - { name: 'browser 4/8', cmd: 'CHECK_LIMIT_S=1800 node js/check-all.js --slow=4/8 -v' }
          - { name: 'browser 5/8', cmd: 'CHECK_LIMIT_S=1800 node js/check-all.js --slow=5/8 -v' }
          - { name: 'browser 6/8', cmd: 'CHECK_LIMIT_S=1800 node js/check-all.js --slow=6/8 -v' }
          - { name: 'browser 7/8', cmd: 'CHECK_LIMIT_S=1800 node js/check-all.js --slow=7/8 -v' }
          - { name: 'browser 8/8', cmd: 'CHECK_LIMIT_S=1800 node js/check-all.js --slow=8/8 -v' }
          - { name: 'heavy 1/6', cmd: 'CHECK_LIMIT_S=1800 node js/check-all.js --heavy=1/6 -v' }
          - { name: 'heavy 2/6', cmd: 'CHECK_LIMIT_S=1800 node js/check-all.js --heavy=2/6 -v' }
          - { name: 'heavy 3/6', cmd: 'CHECK_LIMIT_S=1800 node js/check-all.js --heavy=3/6 -v' }
          - { name: 'heavy 4/6', cmd: 'CHECK_LIMIT_S=1800 node js/check-all.js --heavy=4/6 -v' }
          - { name: 'heavy 5/6', cmd: 'CHECK_LIMIT_S=1800 node js/check-all.js --heavy=5/6 -v' }
          - { name: 'heavy 6/6', cmd: 'CHECK_LIMIT_S=1800 node js/check-all.js --heavy=6/6 -v' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run (report-only)
        run: |
          set -o pipefail
          bash -c "${{ matrix.cmd }}" 2>&1 | tee "$RUNNER_TEMP/run.log"
      - name: Summary — secondary findings
        if: always()
        run: |
          {
            echo "### secondary (report-only): ${{ matrix.name }}"
            grep -E '^(WARN|OK|FAILED) —' "$RUNNER_TEMP/run.log" | tail -4 || true
            grep -cE '^\s+WARN\s' "$RUNNER_TEMP/run.log" | sed 's/^/WARN lines: /' || true
          } >> "$GITHUB_STEP_SUMMARY"

  stability:
    name: stability guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Score, head against base
        run: |
          set -o pipefail
          node check/stability-guard.js .base | tee -a "$GITHUB_STEP_SUMMARY"
