<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@family.</title>
  <!-- Patrick Hand = the pen the notes are written in. Chosen over the flowing script faces
       because it's PRINTED, not joined — by some distance the most legible handwriting face
       at small sizes, which matters for dense topic lists. Loaded here rather than
       @import-ed in the CSS so it starts downloading immediately. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header style="display:flex;justify-content:space-between;align-items:center">
    <h1>@family.</h1>
    <span id="header-auth"></span>
  </header>

  <div id="health-banner" class="health-banner hidden"></div>

  <main>
    <section>
      <h2>Showcase</h2>
      <div class="filters" id="post-filters"></div>
      <div id="gallery" class="grid"><p class="loader-text">Loading showcase...</p></div>
    </section>

    <section>
      <h2>Classes &amp; Booking</h2>
      <div class="filters" id="class-filters"></div>
      <div id="classes" class="grid"><p class="muted">Loading...</p></div>
    </section>

    <section>
      <h2>Venues</h2>
      <div id="venue-diag" style="font-size:12px;color:#ffd700;background:rgba(0,0,0,.5);padding:6px 10px;border-radius:6px;margin-bottom:8px;font-family:monospace;white-space:pre-wrap;display:none"></div>
      <div class="filters" id="venue-filters"></div>
      <div id="venues" class="grid"><p class="muted">Loading...</p></div>
    </section>

    <section>
      <h2>People</h2>
      <div class="filters" id="tutor-filters"></div>
      <div id="tutors" class="grid"><p class="muted">Loading...</p></div>
    </section>

    <section id="checklist-section">
      <h2>Tools</h2>
      <div class="filters" id="tool-filters"></div>
      <div id="checklist-content" class="grid"><p class="muted">Loading...</p></div>
    </section>

    <section id="arcade-section">
      <h2>Arcade</h2>
      <div id="arcade-content" class="grid"></div>
    </section>

    <section>
      <h2>Shop</h2>
      <div class="filters" id="shop-filters"></div>
      <div id="shop" class="grid"><p class="muted">Loading...</p></div>
    </section>

    <section>
      <h2>Helpful Links</h2>
      <div class="filters" id="link-filters"></div>
      <div id="links" class="grid"><p class="muted">Loading...</p></div>
    </section>
  </main>

  <footer><p class="muted center">© 2026 @family.</p></footer>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button type="button" class="modal-close">&times;</button>
      <h3 id="modal-title" class="gold">Intro</h3>
      <iframe id="modal-frame" src="" allow="autoplay"></iframe>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
