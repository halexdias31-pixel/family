<!doctype html>
<html lang="en" class="flow">
<head>
<meta charset="utf-8">
<!-- ---------- THE ONE FILE THAT CANNOT DATE ITS OWN URL § -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">

<!-- ---------- PUTTING IT ON A HOME SCREEN § -->
<!-- THE MANIFEST, WRITTEN INTO THE PAGE rather than kept as a file. § -->
<!-- A FILE, NOT A data: URL (492): a data: manifest has no address for start_url to be read against, and Add to Home Screen needs it to open full-screen. -->
<link rel="manifest" href="manifest.webmanifest">
<!-- THERE WAS NO `rel="icon"` LINE AT ALL, which is why the tab showed the browser's globe. § -->
<!-- THE TAB ICON IS ITS OWN CIRCLE, favicon.png, cut by tools/make-favicon.py. § -->
<link rel="icon" id="favicon" href="favicon.png?v=1106">
<link rel="apple-touch-icon" id="favicon-ios" href="icon.png?v=1106">
<!-- BOTH NAMES, BECAUSE ONE OF THEM IS DEPRECATED AND THE OTHER IS NOT UNIVERSAL. § -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="@family.">
<title>@family.</title>

<!-- NOTHING HERE IS EVER CACHED. § -->
<script>
  /* PHONE OR WIDE IS DECIDED BEFORE THE FIRST PAINT (561): the 700 is shell.js's WIDE_FROM; check-css compares the two. */
  try { if (matchMedia('(min-width:700px)').matches) document.documentElement.classList.add('wide'); } catch (e) {}
  /* ---------- THE PURGE THAT USED TO BE HERE, AND WHY IT IS NOT § */
  /* ---------- ?dev: THE SAME ESCAPE, ON DEMAND, AND IT HAS TO BE HERE § */
  try {
    if (/(?:^|[?&])dev(?:[=&]|$)/.test(location.search)
        && navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        var had = rs && rs.length;
        (rs || []).forEach(function (r) { r.unregister(); });
        var done = (window.caches && caches.keys)
          ? caches.keys().then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k); }));
            })
          : Promise.resolve();
        return done.then(function () { if (had) location.reload(); });
      }).catch(function () {});
    }
  } catch (e) {}

  /* ONE number, used by both — so the stylesheet and the script can never come from different
     loads. A half-updated pair is a bug that appears sometimes and never reproduces. */
  /* ---------- WHY THIS IS A VERSION AND NOT THE CLOCK § */
  /* WHEN THE SITE WAS BUILT — still read, and still only for the footer. § */
  var LOAD_AT = Date.parse(document.lastModified);
  if (!LOAD_AT || isNaN(LOAD_AT)) LOAD_AT = Date.now();
  var LOAD;

  /* ---------- ?dev — NEVER CACHE, WHILE YOU ARE THE ONE LOOKING § */
  /* ---------- AND THEN IT WAS THE CLOCK ALL THE TIME § */

  /* ---------- AND THEN THE 230KB WAS A MEGABYTE § */
  /* THE FILES' OWN HASH (750), written by tools/build-stamp.js and held to them by its --check: it moves when a served file changes and never by the clock. */
  var BUILD_STAMP = 'baa03ea8a678';
  LOAD = /(?:^|[?&])dev(?:[=&]|$)/.test(location.search)
    ? String(Date.now())                        /* the publisher: nothing may be held */
    : BUILD_STAMP || String(Math.floor(LOAD_AT / 300000));     /* everybody else: the hash; the old rounded build time only if the line was emptied */

  /* WHAT THE FOOTER SHOWS, from the same instant — so the version on screen is a MEASUREMENT of what is running rather than a second thing to remember to type. § */
  /* LOCAL TIME, NOT UTC. § */
  window.SITE_STAMP = ((d, p) => p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + String(d.getFullYear()).slice(-2)
    + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()))(new Date(LOAD_AT), n => String(n).padStart(2, '0'))
    /* NO MODE TO REPORT ANY MORE — there is only one. The stamp still says when the site was built,
       which is the thing worth reading in a footer. */;
  /* The stylesheet is beside index.html, not in `js/` — so no folder here, deliberately. */
  /* ---------- THE SCRIPTS ARE TOLD ABOUT AT THE SAME MOMENT AS THE STYLESHEET § */
  /* ---------- ONE LIST, AND IT IS THIS ONE § */
  window.FILES = ['core', 'core-price', 'predicates', 'predicates-marks', 'predicates-fig', 'finder-tags', 'price-rows', 'facts', 'data', 'data-text', 'library', 'qtypes', 'settings', 'settings-read', 'shell-boot', 'shell-layout', 'shell-pages', 'shell-click', 'shell-api', 'shell-hold', 'rules', 'cards-people', 'cards-parts', 'cards-make', 'form', 'me-account', 'me-messages', 'me-roles', 'me-shelves', 'me-settings', 'me-card', 'me-people', 'posts',
    'links', 'find-finder', 'find-facets', 'find-history', 'find-timelines', 'find-boxers', 'find-parts', 'find-marking', 'find-cells', 'find-pen', 'find-pad', 'find-loupe', 'find-figures', 'find-aloud', 'find-doors', 'find-levels', 'find-bundles', 'find-pages', 'find-quick', 'find-measure',
    'keypad-keys', 'keypad-pad', 'keypad-edit', 'answers', 'submit', 'working', 'work-file', 'calc-engine', 'calc', 'qtools', 'resource', 'arcade', 'map', 'book-steps', 'book-rows', 'book-spine', 'receipt', 'records', 'biz-check', 'one-place', 'mat',
    'overworld', 'select', 'collections', 'tiles', 'tiles-jobs', 'reader', 'writings', 'talmud', 'quran', 'hadith', 'works', 'texts', 'pdtexts', 'orthodox', 'hymns', 'mechanics', 'chemistry', 'staff', 'qr', 'flyer', 'lego', 'help', 'layout', 'words', 'gtasks', 'push', 'offline', 'inbox', 'missing', 'boot'];
  /* NOT BEFORE THE FIRST SCREEN (670): these run after boot.js, asked for by `laterFiles_` (data.js) once the first column is drawn, in this order; `load()` waits for them before it paints the payload. */
  window.LATER = ['mat', 'facts', 'keypad-keys', 'keypad-pad', 'keypad-edit', 'answers', 'submit', 'calc-engine', 'calc', 'qtools', 'working', 'work-file', 'receipt', 'records', 'biz-check', 'one-place', 'staff', 'qr', 'flyer', 'lego', 'inbox', 'gtasks', 'push', 'offline', 'reader', 'writings', 'talmud', 'quran', 'hadith', 'works', 'texts', 'pdtexts', 'orthodox', 'hymns', 'mechanics', 'chemistry', 'layout', 'words', 'help', 'map', 'book-steps', 'book-rows', 'book-spine', 'collections', 'find-finder', 'find-facets', 'find-history', 'find-boxers', 'find-parts', 'find-marking', 'find-cells', 'find-pen', 'find-pad', 'find-loupe', 'find-figures', 'find-aloud', 'find-doors', 'find-timelines', 'find-levels', 'find-bundles', 'find-pages', 'find-quick', 'find-measure'];
  /* LAZY (1080): the LATER files only widgets use, fetched by `lazyFiles_` (data.js) when one of those widgets first starts, never at boot. Written by tools/tiers.js. */
  window.LAZY = ['mat', 'records', 'biz-check', 'one-place', 'inbox'];
  /* OFF (860): files whose every widget data/settings/tiers.json turns off — kept in FILES and the repo, never fetched. Written by tools/tiers.js. */
  window.OFF = [];
  window.EAGER = FILES.filter(function (f) { return LATER.indexOf(f) === -1 && OFF.indexOf(f) === -1; });
  /* BUNDLES (1211): one file per batch, joined by tools/bundle.js in this order, so a return visit re-asks 1-3 URLs, not ~56. ?dev or ?nobundle loads js/ one by one. */
  window.BUNDLE = !/(?:^|[?&])(?:dev|nobundle)(?:[=&]|$)/.test(location.search);
  window.FIRST = BUNDLE ? ['bundle/first'] : EAGER.map(function (f) { return 'js/' + f; });
  /* THE REQUEST GOES OUT NOW, NOT AFTER A MEGABYTE OF JAVASCRIPT HAS PARSED. § */
  try {
    if (window.fetch && location.protocol !== 'file:') {
      var u = null;
      try { u = JSON.parse(localStorage.getItem('familyUser') || 'null'); } catch (e) {}
      var qs = [];
      if (u && u.personId) qs.push('person=' + encodeURIComponent(u.personId));
      if (u && u.name) qs.push('name=' + encodeURIComponent(u.name));
      /* AND THE TOKEN, which is what `doGet` now decides who you are from — a name was a claim, and the app prints names. § */
      if (u && u.token) qs.push('token=' + encodeURIComponent(u.token));
      var url = 'https://script.google.com/macros/s/AKfycbyDr5ZsF63_zfgx3tlhqPF3H7U8zSY8TjB8EKY30ZWxBfDIR0QztN4B64V9c-mud7Go/exec'
        + (qs.length ? '?' + qs.join('&') + '&' : '?') + '_=' + Date.now();
      /* CAUGHT HERE AS WELL AS THERE. § */
      window.BOOT_GET = fetch(url, { cache: 'no-store' }).catch(function () { return null; });

      /* THE LIBRARY IS NOT ASKED FOR HERE (630): on a phone's link its megabyte fought the code for the wire and the screen stayed black; boot.js asks once the first screen is drawn. */
    }
  } catch (e) {}

  /* AND THE TYPEFACE WITH THE STYLESHEET, so the first words are drawn once in it rather than swapped (630). */
  document.write('<link rel="stylesheet" href="style.css?t=' + LOAD + '">'
    + '<link rel="preload" as="font" type="font/woff2" href="fonts/family-code.woff2" crossorigin>'
    + FIRST.map(function (f) {
        return '<link rel="preload" as="script" href="' + f + '.js?t=' + LOAD + '">';
      }).join(''));
</script>

<!-- THE SCRIPTS ARE ASKED FOR HERE, IN THE HEAD, AND NOT AT THE FOOT OF THE BODY. § -->

<script>
  /* TWENTY FILES, ONE SCOPE, ONE ORDER. § */
  /* Collected rather than reported one at a time: a wrong folder means eighteen of these, and
     eighteen messages is a wall. The check a second later prints the list. */
  window.__missing = function (f) { (window.__gone = window.__gone || []).push(f); };

  /* NINETEEN NOW — `flyer` sits after `receipt` because it uses `money` and `esc` from core and
     `openSheet` from shell, and before `boot`, which starts everything. */
  /* `FILES` — declared with the preloads in the head. See the note there. */
  FIRST.forEach(function (f) {
    /* `js/` — THE FOLDER THEY ARE ACTUALLY IN. § */
    /* `onerror` NAMES THE FILE THAT DID NOT ARRIVE. § */
    /* ---------- `defer`, AND IT IS THE WHOLE OPTIMISATION § */
    document.write('<scr' + 'ipt defer src="' + f + '.js?t=' + LOAD
      + '" onerror="__missing(\'' + f.replace(/^js\//, '') + '\')"><\/scr' + 'ipt>');
  });
</script>

<noscript><link rel="stylesheet" href="style.css"></noscript>

<!-- THE THREE `no-store` TAGS THAT WERE HERE ARE GONE, for the same reason as the clock above: § -->
</head>
<body>

<!-- THE SHELL. Two fixed parts and one scrolling one: § -->

<!-- THE HEADER WAS HERE. § -->

<!-- NO SPLASH (466): the first screen paints at once from the markup and the device's copy; what still waits shows loading_() in place. -->
<div id="boot-slow" class="hidden"></div>
<script>
  /* AND IF THE CODE ARRIVED AND THE DATA NEVER DOES. § */
  /* ONLY WHILE THE CODE OR THE BACKEND'S REPLY IS MISSING, and it says which in plain words (503). "Files" was the deploy stamp, not a count. */
  setTimeout(function () {
    if (typeof LOADED !== 'undefined' && LOADED) return;     // finished
    var codeHere = (typeof go === 'function');
    if (codeHere && window.PAYLOAD_IN) return;               // the reply came; the rest has its own deadlines
    var url = (typeof API !== 'undefined') ? API : '';
    try { LOAD_SLOW = true; } catch (e) {}
    var b = document.getElementById('boot-slow');
    if (!b) return;
    b.className = '';
    /* ONE CALM CARD (owner, 11 Nov): the bar keeps going, the plain words, one round Try again; the address only for an admin, behind its ⋯. */
    var admin = false;
    try { admin = typeof isAdmin === 'function' && isAdmin(); } catch (e) {}
    var again = '';
    try { again = codeHere && typeof tile_ === 'function' ? tile_({ icon: 'again', label: 'Try again', act: 'retry' }) : ''; } catch (e) {}
    var inner = '<p>Taking longer than usual. It will finish by itself.</p>'
      + (typeof loading_ === 'function' ? loading_() : '')
      + '<div class="tile-row">' + (again || '<a class="tile" href="">Try again</a>') + '</div>'
      + (admin ? '<details class="boot-why"><summary aria-label="Details">\u22ef</summary>'
        + (codeHere ? 'Waiting for ' : 'Code missing' + (window.__gone && window.__gone.length ? ': ' + window.__gone.join(', ') : '') + '. ')
        + (url ? url.replace(/[<>&"]/g, '') : '') + '</details>' : '');
    try { b.innerHTML = typeof card_ === 'function' ? card_(inner) : '<div class="card">' + inner + '</div>'; } catch (e) { b.innerHTML = '<div class="card">' + inner + '</div>'; }
  }, 30000);

</script>

<!-- A banner for the things that must interrupt: a failed save, a sheet that needs fixing, a
     backend older than the site. -->
<div id="banner" class="hidden"></div>
<!-- THE ONE QUIET LINE WHILE THE APP ASKS THE BACKEND AGAIN — "Reconnecting…", and after two minutes "Can't reach the server — still trying." § -->
<p id="reconnect" role="status" aria-live="polite"></p>

<!-- THE TOP BAR (900): the brand and who is signed in; shown only with FLOW_LAYOUT (shell.js). -->
<header id="topbar"><span class="topbar-brand">@family.</span><span id="topbar-who"></span></header>
<main id="screen">
  <!-- Every screen lives here. § -->

  <!-- ONE SECTION, BECAUSE THERE IS ONE SCREEN. § -->
  <!-- ONE SECTION PER TAB. § -->
  <section class="screen card-grid hidden" id="s-spotlight"></section>
  <section class="screen card-grid hidden" id="s-feed"></section>

<!-- The sheet. One element, reused: a booking, a profile, a form. Not a pop-up (453): `openSheet` moves it
     INTO the card that was pressed, and Back brings it back here, unseen. -->
<template id="sheet-home"></template>
<div id="sheet" class="hidden">
  <div id="sheet-head">
    <button type="button" id="sheet-close" aria-label="Back">&#8249; Back</button>
    <span id="sheet-title"></span>
  </div>
  <div id="sheet-body"></div>
</div>

<!-- `#drop` AND `#drop-back` WERE HERE: § -->

<!-- `<nav id="tabs">` WAS HERE AND WAS ALREADY EMPTY. § -->

<!-- Dated with the same number as the stylesheet, and at the END of the body, where script.js
     expects every element above it to already exist. -->

<script>
  /* DID THE CODE ACTUALLY ARRIVE? § */
  /* A ONE-SECOND TIMER WAS ASKING A QUESTION NOBODY COULD YET ANSWER, AND IT DEMOLISHED THE PAGE. § */
  (function () {
    var sheet = null;
    var up = function () { return typeof go === 'function'; };

    /* SOME OF IT ARRIVED AND SOME DID NOT — the worst case, and the one that produces a message
       about a variable rather than a file. The app may even draw before it throws. */
    function partly(gone) {
      var b = document.getElementById('banner');
      if (!b) return;
      b.className = '';
      b.innerHTML = '<b>' + gone.length + ' file' + (gone.length === 1 ? '' : 's')
        + ' did not load:</b> ' + gone.join(', ')
        + '.<br>Anything they hold is missing, so parts of the app will fail with errors that '
        + 'name something else. Check those names against the files in <code>js/</code>.';
    }

    function say(gone, waiting) {
      if (sheet) return;
      /* THE COUNT IS READ OFF THE LIST, NOT TYPED INTO THE SENTENCE. § */
      var n = (window.FILES || []).length;
      var first = (window.FILES || ['shell'])[0];
      var here = location.href.replace(/[^/]*$/, '');
      sheet = document.createElement('div');
      sheet.id = 'boot-trouble';
      sheet.setAttribute('style',
        'position:fixed;inset:0;z-index:99999;overflow:auto;background:#0b0b0b;'
        + 'font:14px/1.6 ui-monospace,Menlo,monospace;color:#f4f1e8;padding:2rem');
      sheet.innerHTML =
        '<div style="max-width:34rem;margin:0 auto">'
        + '<p style="color:#f0a93c;font-weight:700;font-size:1.1rem">'
        + (waiting ? 'The app is still loading.' : 'The app did not load.') + '</p>'
        + (waiting
          ? '<p>Its code has been asked for and has not arrived. The markup is here, which is why '
            + 'this still looks like the app — nothing on it will do anything until the rest '
            + 'turns up. If it does, this message goes away on its own.</p>'
          : '<p>None of its code arrived, so nothing on this page does anything. The markup is '
            + 'here, which is why it still looks like the app.</p>')
        + '<p>It asked for:<br><code style="color:#7de6ff">' + here + 'js/' + first + '.js</code>'
        + ' and ' + (n - 1) + ' more.</p>'
        + (gone.length ? '<p>None of these arrived:<br><code style="color:#7de6ff">'
          + gone.join(', ') + '</code></p>' : '')
        + '<p>Almost always this is one of two things:</p>'
        + '<p>1. The files are not in a <code>js/</code> folder beside this page. Either move them '
        + 'there, or change the one line in index.html that says <code>"js/"</code>.<br>'
        + '2. One of the ' + n + ' names in that list does not match a file. The list is in order '
        + 'and the order matters — <code>boot</code> is last on purpose.</p>'
        + '<p style="color:var(--faint, #848484)">Open the console and look for 404s: whichever addresses are '
        + 'red are the ones to fix.</p></div>';
      document.body.appendChild(sheet);
    }

    function clear() {
      if (!sheet) return;
      sheet.parentNode.removeChild(sheet);
      sheet = null;
    }

    function judge(waiting) {
      var gone = window.__gone || [];
      if (up()) { clear(); if (gone.length) partly(gone); return true; }
      say(gone, waiting);
      return false;
    }

    /* A LITTLE AFTER `load`, NOT ON IT. § */
    function atLoad() { setTimeout(function () { judge(false); }, 60); }
    if (document.readyState === 'complete') atLoad();
    else window.addEventListener('load', atLoad);

    /* AND IF SOMETHING NEVER COMES BACK, `load` NEVER FIRES. § */
    setTimeout(function () { if (!up()) judge(true); }, 10000);
    setInterval(function () { if (up()) { clear(); } }, 500);
  })();
</script>
<noscript>
  <p style="padding:2rem;text-align:center;color:#9a9a9a;font-family:monospace">
    @family. needs JavaScript to run.
  </p>
</noscript>
